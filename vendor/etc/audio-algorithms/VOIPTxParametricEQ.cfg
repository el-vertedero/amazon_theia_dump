/*
    Parametric EQ Configuration EQv5.4
    options for FilterType : LOW_PASS, HIGH_PASS, BAND_PASS, NOTCH, PEAK, LOW_SHELF, HIGH_SHELF, BYPASS
    Fc : Cutoff/Center Frequency in Hertz
    Q:   Quality Factor
    GaindB: Gain in dB

*/

{
    "Bypass"            : true,
    "NumBiquads"        : 4,   // MUST be a multiple of 4

    "Biquad Definitions":
    [
        // Biquad 1. add a peak to push up SFR dip around 1khz by 3db
        {
            "FilterType" : "LOW_SHELF",
            "Fc"         : 650,
            "Q"          : 0.8,
            "GaindB"     : 5.0
        },
        // Biquad 2
        {
            "FilterType" : "BYPASS",
            "Fc"         : 100,
            "Q"          : 0.8,
            "GaindB"     : 1.5
        },
        // Biquad 3
        {
            "FilterType" : "PEAK",
            "Fc"         : 1000,
            "Q"          : 1.2,
            "GaindB"     : -2.0
        },
        // Biquad 4
        {
            "FilterType" : "BYPASS",
            "Fc"         : 5000,
            "Q"          : 20,
            "GaindB"     : -20.0
        }
   ]
}

