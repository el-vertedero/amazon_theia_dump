provisioning_manager {
    ble_beacon_enabled = true
    map_token_supported = true
    get_access_token_command = "/vendor/bin/halo_access_token"
    world_path = "/data/vendor/halo/etc/maintainer/world"
    cacert_path = "/vendor/etc/halo/ca-certificates.crt"
    capath_path = "/system/etc/security/cacerts"
}
