# PTS AVDTP set config reject error code
#
# A2DP_BAD_OBJ_TYPE 214 : Object type is not valid
# A2DP_BAD_CHANNEL 216 : None or multiple values have been selected for Channels
# A2DP_BAD_SAMP_FREQ 195 : Sampling Frequency is not valid
# A2DP_NS_VBR 211 : VBR is not supported
# A2DP_NS_OBJ_TYPE 215 : Object type is not supported
# A2DP_NS_CHANNEL 217 : Channels is not supported
# A2DP_NS_SAMP_FREQ 196 : Sampling Frequency is not supported
# A2DP_BAD_CH_MODE 197 : Channel Mode is not valid
# A2DP_BAD_SUBBANDS 199 : Subbands not valid
# A2DP_BAD_ALLOC_METHOD 201 : Allocation method not valid
# A2DP_BAD_BLOCK_LEN 221 : block len not supported
# A2DP_NS_CODEC_TYPE 194 : Media Codec Type is not supported
# A2DP_BAD_CODEC_TYPE 193 : Media Codec Type is not valid
# A2DP_BAD_MIN_BITPOOL 203 : Minimum Bitpool Value is not valid
# A2DP_BAD_MAX_BITPOOL 205 : Maximum Bitpool Value is not valid
# AVDT_BAD_DRC 228: Object Type and DRC is invalid
# AVDT_NS_DRC 229: DRC is not support
#
